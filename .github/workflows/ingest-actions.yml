name: ingest-actions

# Runs the ingest on a GitHub Actions runner instead of the 512 MB Render box: no memory
# ceiling, a full budget per run, and free minutes for public repos.
#
# DISPATCH-ONLY on purpose. Nothing runs until the maintainer:
#   1. adds the repo secret NEON_DATABASE_URL (Neon, pooled OFF);
#   2. dispatches it once by hand (Actions → ingest-actions → Run workflow) and reads the
#      budget summary;
#   3. only then adds a `schedule:` trigger (e.g. every 12 hours) and pauses the
#      Render-triggered `ingest` workflow, so the two don't compete.
# The run lock (ux_ingest_runs_one_open) makes an overlap with a Render run harmless: the
# second one exits without starting.
#
# Alert emails send from here only if RESEND_API_KEY, RESEND_FROM and APP_URL are also set
# as repo secrets; otherwise alerts stay in-app for runs made here.
on:
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: "Wall-clock budget for fetching boards (seconds)"
        required: false
        default: "2400"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - name: Require the database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL repo secret is not set" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: api/models/minilm
          key: minilm-onnx-v1
      - name: Fetch the embedding model (skips files already cached)
        run: python -m app.ml.download
      - name: Ingest
        env:
          BUDGET: ${{ github.event.inputs.budget_seconds }}
        run: python -m app.ingest.schedule --once --budget "${BUDGET:-2400}" --report "$RUNNER_TEMP/report.json"
      - name: Budget report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/report.json" ]; then
            python ../tools/ingest_budget_report.py "$RUNNER_TEMP/report.json" >> "$GITHUB_STEP_SUMMARY"
          fi
