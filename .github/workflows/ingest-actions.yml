name: ingest-actions

# The scheduled refresh. It runs on a GitHub Actions runner (4 CPUs, no memory ceiling,
# free for public repos) instead of Render's free 512 MB box, where a 10-minute slice
# reached only ~6-40 boards (a full pass took about two weeks). One run refreshes every
# board, then embeds new roles. Without the NEON_DATABASE_URL repo secret it skips itself,
# and the Render-triggered `ingest` workflow's schedule stands down once the secret exists,
# so exactly one scheduled path is active. Both refuse to start while another run is in
# flight (an open run younger than two hours). GitHub may start scheduled runs hours late.
on:
  schedule:
    - cron: "17 4 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Check for the database secret
        id: secret
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::NEON_DATABASE_URL repo secret is not set; skipping. The Render-triggered ingest workflow keeps refreshing a slice meanwhile."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.secret.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install
        if: steps.secret.outputs.present == 'true'
        run: pip install -e .
      - name: Cache the embedding model
        if: steps.secret.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: api/models/minilm
          key: minilm-onnx-v1
      - name: Fetch the embedding model (skips files already cached)
        if: steps.secret.outputs.present == 'true'
        run: python -m app.ml.download
      - name: Refresh every board, then embed new roles
        if: steps.secret.outputs.present == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          # Saved-search alert emails send only if these are set; addresses are never logged.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          APP_URL: ${{ vars.APP_URL || 'https://chronicles-weld.vercel.app' }}
        # A 70-minute budget ends the run cleanly inside the 90-minute job timeout.
        run: python -m app.ingest.schedule --once --budget 4200
