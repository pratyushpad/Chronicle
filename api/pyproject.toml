[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "rapidfuzz>=3.9",
    "apscheduler>=3.10",
    # The ingest parses with the Lexbor backend (`selectolax.lexbor`); 1.0 removed the old
    # Modest backend. Lexbor output matched Modest on 600 fixture inputs (0.4.13 and 1.0.2).
    "selectolax>=0.4,<2",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pgvector>=0.2.5",
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
    "huggingface-hub>=0.23",
    "pypdf>=6.21.2",
    "python-multipart>=0.0.9",
    "ijson>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
